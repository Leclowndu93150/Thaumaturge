name: Parity Difference
description: Something that differs from the original Thaumcraft (missing, changed, or behaves differently).
title: "[Parity]: "
labels: ["parity"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when a feature exists but doesn't match the **original Thaumcraft**, or is missing entirely. **One difference per issue, please.** The most useful thing you can tell me is *exactly how the original behaved* vs *how this version behaves* — without that I can't tell what needs changing.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: This report covers a single feature/difference (not a list).
          required: true
        - label: I searched existing issues and this hasn't already been reported.
          required: true
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version
      description: Which version of the mod is this about? Check the file name if you are unsure.
      options:
        - "26.1.2"
        - "1.21.1"
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature / mechanic / block
      description: What is this about?
      placeholder: e.g. Research Table multiblock, Salis Mundus recipe, Void Guardian bosses
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of difference
      options:
        - Missing entirely (not in this version yet)
        - Present but behaves differently
        - Present but incomplete (missing recipe / texture / entries)
        - Wrong values / stats / recipe
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: How it worked in the original Thaumcraft
      description: Describe the original behavior. Screenshots, wiki links, or version notes are very welcome.
      placeholder: e.g. In the original, placing a research table did nothing until you set two tables side by side and used Scribing Tools on them to form the multiblock.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How it behaves in this version
      description: What does the remake do instead?
      placeholder: e.g. Placing a single research table immediately creates the multiblock.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / references
      description: Images comparing original vs current, wiki links, etc.
    validations:
      required: false
